# Builds the Windows desktop installer and attaches it to a GitHub Release.
#
# RazorRC ships one native artifact: an NSIS installer (.exe) for Windows.
# Linux and macOS users run the web build, so there is no matrix here on
# purpose — the single target is declared in `src-tauri/tauri.conf.json`, so
# this workflow passes no bundle flags.
#
# The workflow never creates a tag. `tagName` is only ever set to a tag that
# already exists on the remote, and a manual run uploads the installer as a
# workflow artifact instead of touching releases at all.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test the recovery engine
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # On a tag push this creates (or reuses) the draft release for that tag
      # and uploads the installer. On a manual run `tagName` is empty, so
      # tauri-action builds without creating a release or a tag.
      - name: Build the Windows installer
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: RazorRC ${{ github.ref_name }}
          releaseBody: |
            Windows desktop installer for RazorRC. The installer is unsigned in
            this release, so SmartScreen will ask before the first launch:
            More info -> Run anyway.

            Linux and macOS are served by the web build.
          releaseDraft: true
          prerelease: false

      - name: Upload the installer as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: razorrc-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
