# Builds the four release artifacts on a tag push and attaches them to a draft
# GitHub Release: an NSIS installer for Windows, a .dmg per macOS architecture,
# and an AppImage plus .deb for Linux. Targets themselves are declared in the
# per-platform Tauri config files, so this workflow passes no bundle flags.
#
# Nothing here touches application logic; it is the same `tauri build` a
# maintainer would run locally, on three hosts at once.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test the recovery engine
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ReviveAI ${{ github.ref_name }}
          releaseBody: |
            Desktop builds of ReviveAI. Installers are unsigned in this release:
            Windows SmartScreen and macOS Gatekeeper will both ask before the
            first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
